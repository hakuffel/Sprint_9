services:
  chrome:
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"
    networks:
      - test-net
    volumes:
      - ./attach:/attach
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 5s
      timeout: 5s
      retries: 10

  tests:
    build: .
    depends_on:
      chrome:
        condition: service_healthy
    networks:
      - test-net
    environment:
      REMOTE_URL: http://chrome:4444/wd/hub
    volumes:
      - ./allure-results:/app/allure-results

networks:
  test-net:
    driver: bridge
